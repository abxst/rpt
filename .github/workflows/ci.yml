name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Generate dependency lockfile
        run: cargo generate-lockfile
      - name: Format sources for build validation
        run: cargo fmt --all
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Unit tests
        run: cargo test --all-targets --locked
      - name: Package driver discovery and fail-closed API tests
        run: |
          set -euo pipefail
          cargo build --locked
          ./target/debug/rpt driver-info --driver deb | grep -q 'Version comparison: implemented'
          ./target/debug/rpt driver-info --driver rpm | grep -q 'Package transactions: NOT IMPLEMENTED'
          ./target/debug/rpt driver-info --driver apk | grep -q 'Read-only package query: not implemented'
          ./target/debug/rpt driver-info --driver pacman | grep -q 'Package transactions: NOT IMPLEMENTED'
          ./target/debug/rpt version-compare --driver deb '1.0~rc1' '1.0' | grep -qx -- '-1'
          for family in rpm apk pacman; do
            if ./target/debug/rpt version-compare --driver "$family" 1.0 2.0 >/dev/null 2>&1; then
              echo "Unsafe fallback to Debian version comparator for $family" >&2
              exit 1
            fi
            if ./target/debug/rpt plan-install --driver "$family" package >/dev/null 2>&1; then
              echo "Unsafe transaction planning fallback for $family" >&2
              exit 1
            fi
          done
          cat > "$RUNNER_TEMP/rpt-fedora-os-release" <<'EOF'
          NAME="Fedora Linux"
          ID=fedora
          ID_LIKE="rhel fedora"
          EOF
          ./target/debug/rpt driver-info --os-release "$RUNNER_TEMP/rpt-fedora-os-release" | grep -q 'Driver: rpm'
          echo 'PASS package driver contracts and distro family discovery'
      - name: Read-only APT preferences parser fixture
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rpt-apt/preferences.d"
          cat > "$RUNNER_TEMP/rpt-apt/preferences.d/90custom" <<'EOF'
          Package: bash
          Pin: version 5.2*
          Pin-Priority: 1001

          Package: *
          Pin: release a=noble
          Pin-Priority: -1
          EOF
          ./target/debug/rpt preferences-inspect --apt-root "$RUNNER_TEMP/rpt-apt" > "$RUNNER_TEMP/preferences.txt"
          grep -Fxq 'Pin-Priority: 1001' "$RUNNER_TEMP/preferences.txt"
          grep -Fxq 'Pin-Priority: -1' "$RUNNER_TEMP/preferences.txt"
          if ./target/debug/rpt policy-preview --apt-root "$RUNNER_TEMP/rpt-apt" \
              --cache /nonexistent --package bash >/dev/null 2>&1; then
            echo "Unsafe policy preview accepted active preferences" >&2
            exit 1
          fi
          echo 'Pin-Priority: bad' >> "$RUNNER_TEMP/rpt-apt/preferences.d/90custom"
          if ./target/debug/rpt preferences-inspect --apt-root "$RUNNER_TEMP/rpt-apt" >/dev/null 2>&1; then
            echo "Malformed pinning unexpectedly accepted" >&2
            exit 1
          fi
      - name: Release build
        run: cargo build --release --locked
  apt-metadata-differential:
    name: Ubuntu APT metadata differential
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Refresh APT indexes and install decompressor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq liblz4-tool
      - name: Build RPT
        run: |
          cargo generate-lockfile
          cargo build --locked
      - name: Compare against apt-cache madison
        run: bash tests/ci_apt_metadata.sh
      - name: RPT parallel signed update smoke test
        run: |
          target="$RUNNER_TEMP/rpt-metadata"
          sources="$RUNNER_TEMP/rpt-sources"
          mkdir -p "$sources/sources.list.d"
          cat > "$sources/sources.list.d/ubuntu.sources" <<'EOF'
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu
          Suites: noble noble-updates
          Components: main
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          timeout 240 ./target/debug/rpt update --root "$sources" --output "$target" --workers 8 -q -o Acquire::Retries=2 --no-progress > "$RUNNER_TEMP/rpt-update.log"
          grep -q 'Update summary: 2/2 repositories' "$RUNNER_TEMP/rpt-update.log"
          grep -q 'index attempts' "$RUNNER_TEMP/rpt-update.log"
          test "$(find "$target" -name InRelease -type f | wc -l)" -eq 2
          test "$(find "$target" -name 'index-*' -type f | wc -l)" -eq 2
          cat "$RUNNER_TEMP/rpt-update.log"
      - name: Query downloaded xz Packages cache and dpkg installed status
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/rpt-metadata"
          find "$target" -name 'index-*.xz' -print -exec file {} \; -exec xz --test {} \;
          ./target/debug/rpt cache-versions --cache "$target" --package bash --architecture amd64 > "$RUNNER_TEMP/rpt-bash-versions"
          test -s "$RUNNER_TEMP/rpt-bash-versions"
          apt-cache madison bash | awk -F'|' 'NF>=2 {gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2}' | sort -u > "$RUNNER_TEMP/apt-bash-versions"
          sort -u "$RUNNER_TEMP/rpt-bash-versions" > "$RUNNER_TEMP/rpt-bash-sorted"
          diff -u "$RUNNER_TEMP/apt-bash-versions" "$RUNNER_TEMP/rpt-bash-sorted"
          printf '%s\n' "$(dpkg-query -W -f='${Version}' bash)" > "$RUNNER_TEMP/dpkg-bash-version"
          ./target/debug/rpt installed-version --package bash > "$RUNNER_TEMP/rpt-installed-bash"
          diff -u "$RUNNER_TEMP/dpkg-bash-version" "$RUNNER_TEMP/rpt-installed-bash"
      - name: Preview default-priority policy against apt-cache policy
        run: |
          set -euo pipefail
          policy_root="$RUNNER_TEMP/rpt-default-policy"
          mkdir -p "$policy_root"
          ./target/debug/rpt policy-preview --cache "$RUNNER_TEMP/rpt-metadata" \
            --apt-root "$policy_root" --package bash > "$RUNNER_TEMP/rpt-policy"
          if ./target/debug/rpt policy-preview --cache "$RUNNER_TEMP/rpt-metadata" \
              --apt-root /etc/apt --package bash >/dev/null 2>"$RUNNER_TEMP/rpt-pin-error"; then
            echo "RPT incorrectly accepted Ubuntu Pro pinning" >&2
            exit 1
          fi
          grep -q 'pinning detected' "$RUNNER_TEMP/rpt-pin-error"
          apt-cache policy bash > "$RUNNER_TEMP/apt-policy"
          expected="$(awk '/^[[:space:]]*Candidate:/{print $2;exit}' "$RUNNER_TEMP/apt-policy")"
          actual="$(awk '/Candidate /{print $NF;exit}' "$RUNNER_TEMP/rpt-policy")"
          test -n "$expected"
          test "$expected" = "$actual"
          echo "PASS baseline candidate bash: $actual"
          cat "$RUNNER_TEMP/rpt-policy"
      - name: Read authenticated per-repository package origins
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/rpt-metadata"
          ./target/debug/rpt verified-origins --cache "$cache" --package bash > "$RUNNER_TEMP/rpt-origins"
          test -s "$RUNNER_TEMP/rpt-origins"
          grep -Fq 'archive.ubuntu.com/ubuntu' "$RUNNER_TEMP/rpt-origins"
          grep -Eq ' noble(-updates)? ' "$RUNNER_TEMP/rpt-origins"
          # Verify identity fields parsed from signed Ubuntu InRelease.
          grep -Eq ' main Ubuntu Ubuntu noble(-updates)? noble$' "$RUNNER_TEMP/rpt-origins"
          bad="$RUNNER_TEMP/rpt-corrupt-origins"
          cp -a "$cache" "$bad"
          index="$(find "$bad" -name 'index-*.xz' -print -quit)"
          test -n "$index"
          printf corruption >> "$index"
          if ./target/debug/rpt verified-origins --cache "$bad" --package bash >/dev/null 2>&1; then
            echo 'Tampered repository index accepted for version origins' >&2
            exit 1
          fi
          echo 'PASS signed version origins and tamper rejection'
      - name: Inspect signed phased rollout metadata without making policy decisions
        run: |
          set -euo pipefail
          ./target/debug/rpt phased-inspect --cache "$RUNNER_TEMP/rpt-metadata" --package bash > "$RUNNER_TEMP/rpt-phased-bash"
          test -s "$RUNNER_TEMP/rpt-phased-bash"
          grep -Fq 'archive.ubuntu.com/ubuntu' "$RUNNER_TEMP/rpt-phased-bash"
          echo 'PASS signed rollout metadata inspection'
      - name: Differential C++ APT machine phasing PRNG
        run: |
          set -euo pipefail
          printf '%s\n' '#include <random>' '#include <string>' '#include <iostream>' 'int main(int argc,char**argv){std::string s=std::string(argv[1])+"-"+argv[2]+"-"+argv[3];std::seed_seq seed(s.begin(),s.end());std::minstd_rand rng(seed);std::uniform_int_distribution<unsigned> dist(0,99);std::cout<<dist(rng)<<"\n";}' > "$RUNNER_TEMP/apt-phase-reference.cc"
          g++ -std=c++17 "$RUNNER_TEMP/apt-phase-reference.cc" -o "$RUNNER_TEMP/apt-phase-reference"
          for machine in 00000000000000000000000000000000 11111111111111111111111111111111 aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa; do
            expected="$("$RUNNER_TEMP/apt-phase-reference" foo 1.0 "$machine")"
            actual="$(./target/debug/rpt phased-draw --source foo --version 1.0 --machine-id "$machine")"
            test "$expected" = "$actual"
          done
          ./target/debug/rpt phased-inspect --cache "$RUNNER_TEMP/rpt-metadata" --package bash --machine-id 00000000000000000000000000000000 > "$RUNNER_TEMP/rpt-phasing-detail"
          test -s "$RUNNER_TEMP/rpt-phasing-detail"
          echo 'PASS APT libstdc++ phased random draw and signed source metadata'
      - name: Read-only APT pin priority diagnostic
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/rpt-pin-root"
          mkdir -p "$root/preferences.d"
          printf 'Package: bash\nPin: release a=noble\nPin-Priority: 700\n' > "$root/preferences.d/50rpt"
          ./target/debug/rpt pin-inspect --cache "$RUNNER_TEMP/rpt-metadata" --apt-root "$root" --package bash > "$RUNNER_TEMP/pin-output"
          grep -Fq ' 700 ' "$RUNNER_TEMP/pin-output"
          if ./target/debug/rpt policy-preview --cache "$RUNNER_TEMP/rpt-metadata" --apt-root "$root" --package bash >/dev/null 2>&1; then
            exit 1
          fi
          echo 'Pin: origin example.org' > "$root/preferences.d/50rpt"
          if ./target/debug/rpt pin-inspect --cache "$RUNNER_TEMP/rpt-metadata" --apt-root "$root" --package bash >/dev/null 2>&1; then
            exit 1
          fi
          echo 'PASS conservative pin evaluation'
      - name: Compare restricted candidate against APT on Ubuntu
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/rpt-candidate-apt"
          mkdir -p "$root/preferences.d"
          ./target/debug/rpt candidate-inspect --cache "$RUNNER_TEMP/rpt-metadata" --apt-root "$root" --package bash > "$RUNNER_TEMP/rpt-candidate-result"
          actual="$(awk '/^Candidate:/{print $2;exit}' "$RUNNER_TEMP/rpt-candidate-result")"
          expected="$(apt-cache policy bash | awk '/^[[:space:]]*Candidate:/{print $2;exit}')"
          test "$actual" = "$expected"
          printf 'Package: bash\nPin: release a=noble\nPin-Priority: 1001\n' > "$root/preferences.d/50rpt"
          ./target/debug/rpt candidate-inspect --cache "$RUNNER_TEMP/rpt-metadata" --apt-root "$root" --package bash > "$RUNNER_TEMP/rpt-candidate-pinned"
          grep -Fq 'Priority: 1001' "$RUNNER_TEMP/rpt-candidate-pinned"
          printf 'Package: *\nPin: version 1.0\nPin-Priority: 1001\n' > "$root/preferences.d/50rpt"
          if ./target/debug/rpt candidate-inspect --cache "$RUNNER_TEMP/rpt-metadata" --apt-root "$root" --package bash >/dev/null 2>&1; then
            echo 'unsupported general version pin was accepted' >&2
            exit 1
          fi
          echo 'PASS read-only candidate diagnostic and conservative pin rejection'
      - name: Differential APT general and specific pin precedence
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/rpt-general-policy"
          mkdir -p "$root/preferences.d"
          printf 'Package: *\nPin: release a=noble\nPin-Priority: 730\n\nPackage: bash\nPin: release a=noble\nPin-Priority: 810\n' > "$root/preferences"
          ./target/debug/rpt candidate-inspect --cache "$RUNNER_TEMP/rpt-metadata" --apt-root "$root" --package bash > "$RUNNER_TEMP/rpt-general-bash"
          grep -Fq 'Priority: 810' "$RUNNER_TEMP/rpt-general-bash"
          apt-cache -o Dir::Etc::preferences="$root/preferences" -o Dir::Etc::preferencesparts="$root/preferences.d" policy bash > "$RUNNER_TEMP/apt-general-bash"
          grep -Eq '[[:space:]]810$' "$RUNNER_TEMP/apt-general-bash"
          expected="$(awk '/^[[:space:]]*Candidate:/{print $2;exit}' "$RUNNER_TEMP/apt-general-bash")"
          actual="$(awk '/^Candidate:/{print $2;exit}' "$RUNNER_TEMP/rpt-general-bash")"
          test "$actual" = "$expected"
          printf 'Package: *\nPin: release a=noble\nPin-Priority: 730\n' > "$root/preferences"
          ./target/debug/rpt candidate-inspect --cache "$RUNNER_TEMP/rpt-metadata" --apt-root "$root" --package bash > "$RUNNER_TEMP/rpt-general-only"
          grep -Fq 'Priority: 730' "$RUNNER_TEMP/rpt-general-only"
          apt-cache -o Dir::Etc::preferences="$root/preferences" -o Dir::Etc::preferencesparts="$root/preferences.d" policy bash > "$RUNNER_TEMP/apt-general-only"
          grep -Eq '[[:space:]]730$' "$RUNNER_TEMP/apt-general-only"
          echo 'PASS APT general and specific pin priority fixtures'
      - name: Differential APT Release conjunctive pin fixture
        run: |
          set -euo pipefail
          set -x
          root="$RUNNER_TEMP/rpt-release-selectors"
          mkdir -p "$root/preferences.d"
          printf 'Package: bash\nPin: release o=Ubuntu, n=noble, a=noble, c=main\nPin-Priority: 751\n' > "$root/preferences"
          ./target/debug/rpt candidate-inspect --cache "$RUNNER_TEMP/rpt-metadata" --apt-root "$root" --package bash > "$RUNNER_TEMP/rpt-release-candidate"
          cat "$RUNNER_TEMP/rpt-release-candidate"
          grep -q 'Priority: 751' "$RUNNER_TEMP/rpt-release-candidate"
          apt-cache -o Dir::Etc::preferences="$root/preferences" -o Dir::Etc::preferencesparts="$root/preferences.d" policy bash > "$RUNNER_TEMP/apt-release-candidate"
          cat "$RUNNER_TEMP/apt-release-candidate"
          grep -Eq '^[[:space:]]*\*\*\*[[:space:]]+[^[:space:]]+[[:space:]]+751$' "$RUNNER_TEMP/apt-release-candidate"
          expected="$(awk '/^[[:space:]]*Candidate:/{print $2;exit}' "$RUNNER_TEMP/apt-release-candidate")"
          actual="$(awk '/^Candidate:/{print $2;exit}' "$RUNNER_TEMP/rpt-release-candidate")"
          test "$expected" = "$actual"
          printf 'Package: bash\nPin: release o=Ubuntu,o=Other\nPin-Priority: 751\n' > "$root/preferences"
          if ./target/debug/rpt candidate-inspect --cache "$RUNNER_TEMP/rpt-metadata" --apt-root "$root" --package bash >/dev/null 2>&1; then
            echo 'duplicate Release selector accepted' >&2
            exit 1
          fi
          echo 'PASS exact conjunctive Release selectors and APT comparison'
      - name: APT Default-Release 990 differential and fail-closed config
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/rpt-default-release"
          mkdir -p "$root/apt.conf.d" "$root/preferences.d"
          printf 'APT::Default-Release "noble";\n' > "$root/apt.conf.d/50target"
          ./target/debug/rpt candidate-inspect --cache "$RUNNER_TEMP/rpt-metadata" --apt-root "$root" --package bash > "$RUNNER_TEMP/rpt-target-result"
          grep -Fq 'Priority: 990' "$RUNNER_TEMP/rpt-target-result"
          apt-cache -o APT::Default-Release=noble -o Dir::Etc::preferences="$root/preferences" -o Dir::Etc::preferencesparts="$root/preferences.d" policy bash > "$RUNNER_TEMP/apt-target-result"
          grep -Eq '[[:space:]]990$' "$RUNNER_TEMP/apt-target-result"
          expected="$(awk '/^[[:space:]]*Candidate:/{print $2;exit}' "$RUNNER_TEMP/apt-target-result")"
          actual="$(awk '/^Candidate:/{print $2;exit}' "$RUNNER_TEMP/rpt-target-result")"
          test "$expected" = "$actual"
          printf 'Package: bash\nPin: release a=noble\nPin-Priority: 1001\n' > "$root/preferences"
          ./target/debug/rpt candidate-inspect --cache "$RUNNER_TEMP/rpt-metadata" --apt-root "$root" --package bash > "$RUNNER_TEMP/rpt-target-specific"
          grep -Fq 'Priority: 1001' "$RUNNER_TEMP/rpt-target-specific"
          printf 'APT::Default-Release "noble*";\n' > "$root/apt.conf.d/50target"
          if ./target/debug/rpt candidate-inspect --cache "$RUNNER_TEMP/rpt-metadata" --apt-root "$root" --package bash >/dev/null 2>&1; then
            echo 'Unsafe target release syntax accepted' >&2
            exit 1
          fi
          echo 'PASS target release priority and fail-closed config'
      - name: Read-only metadata show search list on Ubuntu
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/rpt-metadata"
          ./target/debug/rpt show --cache "$target" bash > "$RUNNER_TEMP/rpt-show-bash"
          grep -Fq 'Package: bash' "$RUNNER_TEMP/rpt-show-bash"
          ver="$(./target/debug/rpt cache-versions --cache "$target" --package bash | head -n 1)"
          grep -Fq "Version: $ver" "$RUNNER_TEMP/rpt-show-bash"
          ./target/debug/rpt search --cache "$target" --limit 20 bash > "$RUNNER_TEMP/rpt-search-bash"
          grep -Fq 'bash - ' "$RUNNER_TEMP/rpt-search-bash"
          ./target/debug/rpt list --cache "$target" --prefix bash --limit 20 > "$RUNNER_TEMP/rpt-list-bash"
          grep -Fq "bash/cache $ver amd64" "$RUNNER_TEMP/rpt-list-bash"
          if ./target/debug/rpt search --cache "$target" --limit 0 bash >/dev/null 2>&1; then
            echo "Invalid result limit accepted" >&2
            exit 1
          fi
          ./target/debug/rpt depends --cache "$target" bash > "$RUNNER_TEMP/rpt-depends"
          grep -Fq 'Depends:' "$RUNNER_TEMP/rpt-depends"
          ./target/debug/rpt rdepends --cache "$target" --limit 10 libc6 > "$RUNNER_TEMP/rpt-rdepends"
          test -s "$RUNNER_TEMP/rpt-rdepends"
          echo "PASS cached show/search/list/depends/rdepends"
      - name: Fail-closed dependency install-plan fixture (read only)
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/rpt-plan-fixture"
          mkdir -p "$fixture/cache/abcdefabcdefabcdefabcdef" "$fixture/apt"
          printf 'test fixture only\n' > "$fixture/cache/abcdefabcdefabcdefabcdef/InRelease"
          cat > "$fixture/cache/abcdefabcdefabcdefabcdef/index-0.raw" <<'EOF'
          Package: app
          Version: 2.0
          Architecture: amd64
          Depends: libdemo (>= 1.0)

          Package: libdemo
          Version: 1.1
          Architecture: amd64

          EOF
          touch "$fixture/status"
          # Unsigned fixture metadata can be inspected by standalone unit tests,
          # but may no longer authorize an install-plan preview.
          if ./target/debug/rpt plan-install --cache "$fixture/cache" --status "$fixture/status" --apt-root "$fixture/apt" app >/dev/null 2>&1; then
            echo "Plan accepted metadata without verified repository provenance" >&2
            exit 1
          fi
          cat > "$fixture/apt/preferences" <<'EOF'
          Package: *
          Pin: release a=noble
          Pin-Priority: 900
          EOF
          if ./target/debug/rpt plan-install --cache "$fixture/cache" --status "$fixture/status" --apt-root "$fixture/apt" app >/dev/null 2>&1; then
            echo "Plan incorrectly accepted unsigned data with APT preferences" >&2
            exit 1
          fi
          echo "PASS install-plan policy gate rejects unsigned cache and unsafe preferences"
      - name: Signed package acquisition manifest and tamper detection
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/rpt-metadata"
          manifest="$RUNNER_TEMP/rpt-download-manifest.json"
          ./target/debug/rpt prepare-download --cache "$cache" --manifest "$manifest" bash
          python3 - "$manifest" <<'PY'
          import json, sys
          manifest = json.load(open(sys.argv[1]))
          assert len(manifest['packages']) == 1
          pkg = manifest['packages'][0]
          assert pkg['name'] == 'bash'
          assert pkg['filename'].startswith('pool/')
          assert pkg['size'] > 0
          assert len(pkg['sha256']) == 64
          print('PASS signed source-index-package SHA256 chain')
          PY
          timeout 180 ./target/debug/rpt fetch --manifest "$manifest" \
            --output "$RUNNER_TEMP/rpt-downloaded-debs" --workers 2 --segments 2
          filename="$(python3 - "$manifest" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['packages'][0]['filename'])
          PY
          )"
          test -s "$RUNNER_TEMP/rpt-downloaded-debs/$filename"
          test "$(dpkg-deb -f "$RUNNER_TEMP/rpt-downloaded-debs/$filename" Package)" = bash
          # A local modification must invalidate the verified cache.
          bad="$RUNNER_TEMP/rpt-tampered-cache"
          cp -a "$cache" "$bad"
          index="$(find "$bad" -name 'index-*.xz' -print -quit)"
          test -n "$index"
          printf 'corrupt' >> "$index"
          if ./target/debug/rpt prepare-download --cache "$bad" \
              --manifest "$RUNNER_TEMP/should-not-exist.json" bash >/dev/null 2>&1; then
            echo 'Tampered authenticated cache was accepted' >&2
            exit 1
          fi
          test ! -f "$RUNNER_TEMP/should-not-exist.json"
          echo "PASS downloaded .deb integrity and cache tampering rejection"
      - name: Reject unsupported APT update flags
        run: |
          if ./target/debug/rpt update -o APT::Get::Assume-Yes=true >/dev/null 2>&1; then
            echo 'Unsupported APT settings were accepted' >&2
            exit 1
          fi
      - name: Fail closed for bad repository signing key
        run: |
          sources="$RUNNER_TEMP/rpt-bad-signature"
          target="$RUNNER_TEMP/rpt-bad-signature-cache"
          mkdir -p "$sources/sources.list.d"
          cat > "$sources/sources.list.d/ubuntu.sources" <<'EOF'
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu
          Suites: noble
          Components: main
          Signed-By: /nonexistent/rpt-test-keyring.gpg
          EOF
          if timeout 120 ./target/debug/rpt --log-format json update --root "$sources" --output "$target" --workers 2 --no-progress 1>"$RUNNER_TEMP/rpt-bad.stdout" 2>"$RUNNER_TEMP/rpt-bad.stderr"; then
            echo 'Unsigned metadata was accepted' >&2
            exit 1
          fi
          grep -q '"code":"DOWNLOAD_SIGNATURE"' "$RUNNER_TEMP/rpt-bad.stderr"
          test "$(find "$target" -name InRelease -type f | wc -l)" -eq 0
