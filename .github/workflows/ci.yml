name: CI
on:
  push:
    branches: [main, feat/multiarch-coinstall-preflight]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Generate dependency lockfile
        run: cargo generate-lockfile
      - name: Format sources for build validation
        run: cargo fmt --all
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Unit tests
        run: cargo test --all-targets --locked
      - name: Package driver discovery and fail-closed API tests
        run: |
          set -euo pipefail
          cargo build --locked
          ./target/debug/rpt driver-info --driver deb | grep -q 'Version comparison: implemented'
          ./target/debug/rpt driver-info --driver rpm | grep -q 'Package transactions: NOT IMPLEMENTED'
          ./target/debug/rpt driver-info --driver apk | grep -q 'Read-only package query: not implemented'
          ./target/debug/rpt driver-info --driver pacman | grep -q 'Package transactions: NOT IMPLEMENTED'
          ./target/debug/rpt version-compare --driver deb '1.0~rc1' '1.0' | grep -qx -- '-1'
          for family in rpm apk pacman; do
            if ./target/debug/rpt version-compare --driver "$family" 1.0 2.0 >/dev/null 2>&1; then
              echo "Unsafe fallback to Debian version comparator for $family" >&2
              exit 1
            fi
            if ./target/debug/rpt plan-install --driver "$family" package >/dev/null 2>&1; then
              echo "Unsafe transaction planning fallback for $family" >&2
              exit 1
            fi
          done
          cat > "$RUNNER_TEMP/rpt-fedora-os-release" <<'EOF'
          NAME="Fedora Linux"
          ID=fedora
          ID_LIKE="rhel fedora"
          EOF
          ./target/debug/rpt driver-info --os-release "$RUNNER_TEMP/rpt-fedora-os-release" | grep -q 'Driver: rpm'
          echo 'PASS package driver contracts and distro family discovery'
      - name: Debian version ordering differential against dpkg
        run: |
          set -euo pipefail
          pairs=(
            '1.0|1.0'
            '1.0~rc1|1.0'
            '1:1.0|2.0'
            '1.0-1|1.0-2'
            '1.0+git1|1.0'
            '2.0~~pre|2.0~pre'
            '0:1.0|1.0'
            '1.0-1ubuntu1|1.0-1ubuntu2'
          )
          for pair in "${pairs[@]}"; do
            left="${pair%%|*}"
            right="${pair#*|}"
            actual="$(./target/debug/rpt version-compare --driver deb "$left" "$right")"
            if dpkg --compare-versions "$left" lt "$right"; then
              expected=-1
            elif dpkg --compare-versions "$left" gt "$right"; then
              expected=1
            else
              expected=0
            fi
            if [[ "$actual" != "$expected" ]]; then
              echo "Version ordering mismatch: $left vs $right: rpt=$actual dpkg=$expected" >&2
              exit 1
            fi
          done
          echo 'PASS Debian version ordering differential'
      - name: Read-only APT preferences parser fixture
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rpt-apt/preferences.d"
          cat > "$RUNNER_TEMP/rpt-apt/preferences.d/90custom" <<'EOF'
          Package: bash
          Pin: version 5.2*
          Pin-Priority: 1001

          Package: *
          Pin: release a=noble
          Pin-Priority: -1
          EOF
          ./target/debug/rpt preferences-inspect --apt-root "$RUNNER_TEMP/rpt-apt" > "$RUNNER_TEMP/preferences.txt"
          grep -Fxq 'Pin-Priority: 1001' "$RUNNER_TEMP/preferences.txt"
          grep -Fxq 'Pin-Priority: -1' "$RUNNER_TEMP/preferences.txt"
          if ./target/debug/rpt policy-preview --apt-root "$RUNNER_TEMP/rpt-apt" \
              --cache /nonexistent --package bash >/dev/null 2>&1; then
            echo "Unsafe policy preview accepted active preferences" >&2
            exit 1
          fi
          echo 'Pin-Priority: bad' >> "$RUNNER_TEMP/rpt-apt/preferences.d/90custom"
          if ./target/debug/rpt preferences-inspect --apt-root "$RUNNER_TEMP/rpt-apt" >/dev/null 2>&1; then
            echo "Malformed pinning unexpectedly accepted" >&2
            exit 1
          fi
      - name: Signed APT/RPT dependency plan differential (read-only)
        run: bash tests/signed-plan-differential.sh
      - name: Isolated APT candidate policy fixture
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/rpt-apt-policy"
          mkdir -p "$root/lists/partial" "$root/cache/archives/partial" "$root/etc/preferences.d"
          cat > "$root/status" <<'EOF'
          Package: rpt-fixture
          Status: install ok installed
          Architecture: all
          Version: 2.0

          EOF
          cat > "$root/lists/fixture_Packages" <<'EOF'
          Package: rpt-fixture
          Version: 1.0
          Architecture: all
          Description: isolated test package

          Package: rpt-fixture
          Version: 2.0
          Architecture: all
          Description: isolated test package

          EOF
          cat > "$root/etc/preferences" <<'EOF'
          Package: rpt-fixture
          Pin: version 1.0
          Pin-Priority: 1001
          EOF
          apt-cache -o Dir::State::status="$root/status" \
            -o Dir::State::lists="$root/lists" \
            -o Dir::Cache="$root/cache" \
            -o Dir::Etc::sourcelist=/dev/null \
            -o Dir::Etc::sourceparts=/dev/null \
            -o Dir::Etc::preferences="$root/etc/preferences" \
            -o Dir::Etc::preferencesparts="$root/etc/preferences.d" \
            policy rpt-fixture > "$root/policy.txt"
          grep -Fxq '  Installed: 2.0' "$root/policy.txt"
          grep -Fxq '  Candidate: 2.0' "$root/policy.txt"
          cat "$root/policy.txt"
          # Without a configured repository source, the synthetic Packages file
          # is not an authenticated/registered APT archive. The only candidate
          # guaranteed here is the installed version, regardless of the pin.
          # Do not claim that this fixture exercises repository downgrade.

      - name: Local APT repository downgrade boundary (unprivileged)
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/rpt-apt-local-repo"
          mkdir -p "$root/repo" "$root/lists/partial" "$root/cache/archives/partial" "$root/etc/preferences.d"
          cat > "$root/status" <<'EOF'
          Package: rpt-fixture
          Status: install ok installed
          Architecture: all
          Version: 2.0

          EOF
          cat > "$root/repo/Packages" <<'EOF'
          Package: rpt-fixture
          Version: 1.0
          Architecture: all
          Filename: pool/rpt-fixture_1.0_all.deb
          Size: 1
          Description: local repository policy fixture

          EOF
          printf 'deb [trusted=yes] file:%s/repo ./\n' "$root" > "$root/etc/sources.list"
          apt_opts=(
            -o "Dir::State::status=$root/status"
            -o "Dir::State::lists=$root/lists"
            -o "Dir::Cache=$root/cache"
            -o "Dir::Etc::sourcelist=$root/etc/sources.list"
            -o "Dir::Etc::sourceparts=$root/etc/empty-sources"
            -o "Dir::Etc::preferences=$root/etc/preferences"
            -o "Dir::Etc::preferencesparts=$root/etc/preferences.d"
            -o "APT::Get::List-Cleanup=0"
          )
          mkdir -p "$root/etc/empty-sources"
          apt-get "${apt_opts[@]}" update
          for priority in 999 1000 1001; do
            printf 'Package: rpt-fixture\nPin: version 1.0\nPin-Priority: %s\n' "$priority" > "$root/etc/preferences"
            apt-cache "${apt_opts[@]}" policy rpt-fixture > "$root/policy-$priority.txt"
            grep -Fxq '  Installed: 2.0' "$root/policy-$priority.txt"
            # apt-cache's observed candidate in this fixture switches at 1000.
            # Keep this oracle independent of RPT's current >1000 rule until
            # a dedicated differential test resolves the discrepancy.
            if [[ "$priority" -ge 1000 ]]; then expected=1.0; else expected=2.0; fi
            apt_candidate="$(sed -n 's/^  Candidate: //p' "$root/policy-$priority.txt")"
            rpt_candidate="$(./target/debug/rpt candidate-priority-diagnostic --installed 2.0 --available 1.0 --priority "$priority" | sed -n 's/^Candidate: //p')"
            if [[ -z "$apt_candidate" || "$rpt_candidate" != "$apt_candidate" ]]; then
              echo "APT/RPT candidate mismatch at priority $priority: apt=$apt_candidate rpt=$rpt_candidate" >&2
              exit 1
            fi
            grep -Fxq "  Candidate: $expected" "$root/policy-$priority.txt" || {
              cat "$root/policy-$priority.txt"
              exit 1
            }
          done
      - name: Isolated apt-get simulation resolver oracle (unprivileged)
        run: bash tests/apt-simulation-oracle.sh
      - name: Dry-run transaction CLI end-to-end (unprivileged)
        run: |
          set -euo pipefail
          cargo build --locked --bin rpt-transaction-dry-run --bin rpt-journal-inspect
          bash tests/dry-run-cli-e2e.sh ./target/debug/rpt-transaction-dry-run ./target/debug/rpt-journal-inspect
      - name: Journal crash and corruption fixtures (unprivileged)
        run: |
          set -euo pipefail
          bash tests/journal-crash-fixtures.sh ./target/debug/rpt-transaction-dry-run ./target/debug/rpt-journal-inspect
      - name: Transaction JSONL events (unprivileged)
        run: |
          set -euo pipefail
          bash tests/transaction-json-events.sh ./target/debug/rpt-transaction-dry-run
      - name: Removal planner CLI end-to-end (unprivileged)
        run: bash tests/removal-planner-e2e.sh ./target/debug/rpt
      - name: Release build
        run: cargo build --release --locked
  arm64-native:
    name: Native ARM64 Ubuntu package differential
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Assert native ARM64 architecture (no QEMU)
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          test "$(dpkg --print-architecture)" = "arm64"
          test "$(rustc -vV | awk '/^host:/{print $2}')" = "aarch64-unknown-linux-gnu"
      - name: Rust checks on ARM64 hardware
        run: |
          cargo generate-lockfile
          cargo fmt --all
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked
          cargo build --locked
