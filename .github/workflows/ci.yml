name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Generate dependency lockfile
        run: cargo generate-lockfile
      - name: Format sources for build validation
        run: cargo fmt --all
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Unit tests
        run: cargo test --all-targets --locked
      - name: Release build
        run: cargo build --release --locked
  apt-metadata-differential:
    name: Ubuntu APT metadata differential
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Refresh APT indexes and install decompressor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq liblz4-tool
      - name: Build RPT
        run: |
          cargo generate-lockfile
          cargo build --locked
      - name: Compare against apt-cache madison
        run: bash tests/ci_apt_metadata.sh
      - name: RPT parallel signed update smoke test
        run: |
          target="$RUNNER_TEMP/rpt-metadata"
          sources="$RUNNER_TEMP/rpt-sources"
          mkdir -p "$sources/sources.list.d"
          cat > "$sources/sources.list.d/ubuntu.sources" <<'EOF'
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu
          Suites: noble noble-updates
          Components: main
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          timeout 240 ./target/debug/rpt update --root "$sources" --output "$target" --workers 8
          test "$(find "$target" -name InRelease -type f | wc -l)" -eq 2
          test "$(find "$target" -name 'index-*' -type f | wc -l)" -eq 2
