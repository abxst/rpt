name: Release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: write
jobs:
  build:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Resolve dependencies
        run: cargo generate-lockfile
      - run: cargo fmt --all
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --release --locked
      - name: Package amd64 binary and checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf dist/rpt-linux-amd64.tar.gz -C target/release rpt
          cd dist
          sha256sum rpt-linux-amd64.tar.gz > SHA256SUMS
      - name: Publish guarded experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.1.0-alpha.5
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists, skipping."
            exit 0
          fi
          git fetch origin main
          CURRENT=$(git rev-parse origin/main)
          BUILT=$(git rev-parse HEAD)
          if [ "$CURRENT" != "$BUILT" ]; then
            echo "Skipping stale commit: $BUILT != $CURRENT"
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" dist/rpt-linux-amd64.tar.gz dist/SHA256SUMS \
            --title "RPT $TAG — experimental transport MVP" --prerelease \
            --notes "Experimental concurrent downloader only. Does not install packages or replace APT."
