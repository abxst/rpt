name: Release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: write
jobs:
  build:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Resolve dependencies
        run: cargo generate-lockfile
      - run: cargo fmt --all
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --release --locked
      - name: Package amd64 binary and checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf dist/rpt-linux-amd64.tar.gz -C target/release rpt
          cd dist
          sha256sum rpt-linux-amd64.tar.gz > SHA256SUMS
      - name: Attach fail-closed acceptance status to prerelease
        run: |
          set -euo pipefail
          python3 scripts/production-gate.py --expected-commit "${{ github.event.workflow_run.head_sha }}" \
            > dist/PRODUCTION-QUALIFICATION.json
          python3 - <<'PY'
          import json
          status = json.load(open("dist/PRODUCTION-QUALIFICATION.json"))
          assert status["qualification"] == "BLOCKED"
          assert status["manual_security_review_required"] is True
          assert status["host_execution_allowed"] is False
          PY
      - name: Publish guarded experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.1.0-alpha.22
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists, skipping."
            exit 0
          fi
          git fetch origin main
          CURRENT=$(git rev-parse origin/main)
          BUILT=$(git rev-parse HEAD)
          if [ "$CURRENT" != "$BUILT" ]; then
            echo "Skipping stale commit: $BUILT != $CURRENT"
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" dist/rpt-linux-amd64.tar.gz dist/SHA256SUMS \
            dist/PRODUCTION-QUALIFICATION.json \
            --title "RPT $TAG — experimental package engine (guest only)" --prerelease \
            --notes "Experimental signed metadata, read-only APT-like simulation and disposable guest transactions. M13 v2 snapshot receipts include hardlink, mtime and extended-attribute witnesses; legacy v1 receipts are rejected. Live host dpkg and APT replacement remain BLOCKED; see attached PRODUCTION-QUALIFICATION.json. No stable or production claims."
